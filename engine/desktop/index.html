<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,"><title>HEMU — TempleOS</title><link rel="stylesheet" href="/engine/desktop/view.css"></head>
<body><header><strong>HEMU</strong><button id="pause" disabled>Pause</button><button id="save" disabled>Save session</button>
<label class="button">Open session<input id="open" type="file" accept=".hemu,.gz"></label>
<label>Refresh <select id="rate"><option value="0">Uncapped</option><option value="30">30 Hz</option><option value="60">60 Hz</option><option value="120">120 Hz</option></select></label>
<label><input id="repeat" type="checkbox">BIOS repeat</label><button id="full">Full screen</button>
<span id="fps">— FPS</span></header>
<main><canvas id="screen" width="640" height="480" tabindex="0" aria-label="TempleOS screen"></canvas></main>
<footer><span id="status" role="status">Starting TempleOS…</span><span>Click the screen to type. Full screen captures more keys. Esc releases the pointer.</span></footer>
<script type="module" src="/engine/desktop/app.js"></script></body></html>
