<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="../../Adam/Logo128x152.jpg" type="image/jpeg">
  <title>Terry A. Davis - archive player</title>
  <link rel="stylesheet" href="Clip/Panel.css">
  <link rel="stylesheet" href="../../Adam/Icons.css">
  <style>
    @font-face { font-family:dos_vga; src:url('../../Adam/Fonts/DosVgaNew.woff2') format('woff2'); font-display:swap; }
    :root { --blue:#0000AA; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--blue); color:#FFF; font:16px dos_vga,monospace;
      display:flex; flex-direction:column; gap:10px; padding:14px; min-height:100vh; }
    #bar { display:flex; gap:14px; align-items:center; }
    button { font:inherit; color:#000; background:#FFF; border:2px solid #FFF; }
    button:hover { border-color:#FFFF55; }
    a { color:#FFFF55; }
    #dl { margin-left:auto; }
    h1 { margin:0; font-size:16px; font-weight:normal; color:#FFFF55; overflow-wrap:anywhere; }
    #wrap { flex:1; min-height:0; }
    .video-player { min-height:100%; }
    .video-media { display:flex; flex:1; align-items:center; justify-content:center; }
    .video-media video { max-height:75vh; }
    .clip-panel { color:#FFF; }
  </style>
</head>
<body>
  <div id="bar"><button id="back" title="Back" aria-label="Back">←</button>
    <a id="arch" target="_blank" rel="noopener">Archive.org</a>
    <a id="dl" download>Download original</a></div>
  <h1 id="title">Terry A. Davis</h1>
  <div id="wrap"></div>
  <script type="module">
    import {ArchiveFile,ArchiveDetails} from "./Archive.js";
    import {VideoPlayer} from "./Video.js";
    let params=new URLSearchParams(location.search),file=params.get("f"),
      seconds=Math.max(0,Number(params.get("t")) || 0),player;
    function Changed({video,seconds})
    {
      document.title=video.t+" - Terry A. Davis";
      document.getElementById("title").textContent=video.t;
      document.getElementById("dl").href=ArchiveFile(video.f);
      document.getElementById("arch").href=ArchiveDetails(video.f,seconds);
      document.getElementById("arch").hidden=!video.p;
      params=new URLSearchParams({f:video.f,n:video.t,t:String(seconds)});
      if (video.p) params.set("p","1");
      history.replaceState(null,"","?"+params);
    }
    document.getElementById("back").addEventListener("click",function () {
      if (history.length>1) history.back();else location.href="../../";
    });
    if (file) {
      player=VideoPlayer({f:file,t:params.get("n") || file.split("/").pop(),
        p:Number(params.get("p")) || 0},seconds,true,Changed);
      document.getElementById("wrap").append(player.element);
      addEventListener("pagehide",player.Close);
    } else document.getElementById("wrap").textContent="No video specified.";
  </script>
</body>
</html>
